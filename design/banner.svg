<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="732" viewBox="0 0 1098 732">
  <!-- Store banner (3:2). The keys and the icon use the same glyph as icon.svg and key-*.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141418"/>
      <stop offset="1" stop-color="#211719"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5B52"/>
      <stop offset="1" stop-color="#D92A22"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FF453A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF453A" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <path d="M4.6 3.4L19.4 20.6" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    </mask>
    <g id="mic-live" stroke-linecap="round">
      <rect x="8.6" y="2.4" width="6.8" height="11.6" rx="3.4" fill="#32D74B"/>
      <path d="M5.4 10.9a6.6 6.6 0 0 0 13.2 0M12 17.5v3M8.4 20.9h7.2" fill="none" stroke="#32D74B" stroke-width="2"/>
    </g>
    <g id="mic-muted" stroke-linecap="round">
      <g mask="url(#cut)">
        <rect x="8.6" y="2.4" width="6.8" height="11.6" rx="3.4" fill="#FFFFFF"/>
        <path d="M5.4 10.9a6.6 6.6 0 0 0 13.2 0M12 17.5v3M8.4 20.9h7.2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      </g>
      <path d="M4.6 3.4L19.4 20.6" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <clipPath id="head">
      <rect x="764" y="312" width="112" height="120" rx="52"/>
    </clipPath>
  </defs>
  <rect width="1098" height="732" fill="url(#bg)"/>

  <!-- The plugin icon and the name -->
  <rect x="110" y="98" width="176" height="176" rx="41" fill="url(#red)"/>
  <use href="#mic-muted" transform="translate(198 186) scale(5.43) translate(-12 -12.15)"/>
  <text x="330" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF">Maono Mic Mute</text>
  <text x="332" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#A7B0BE">The real microphone mute, LED and all, on one key</text>

  <g transform="translate(33 0)">
    <!-- The key flips between live and muted... -->
    <rect x="150" y="372" width="160" height="160" rx="26" fill="#1C1C1E" stroke="#3A3F4B" stroke-width="2"/>
    <use href="#mic-live" transform="translate(230 452) scale(3.92) translate(-12 -12.15)"/>
    <path d="M342 452h86M342 452l14-12M342 452l14 12M428 452l-14-12M428 452l-14 12" fill="none" stroke="#5B6270" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="460" y="372" width="160" height="160" rx="26" fill="#E5322D" stroke="#3A3F4B" stroke-width="2"/>
    <use href="#mic-muted" transform="translate(540 452) scale(3.92) translate(-12 -12.15)"/>

    <!-- ...and the mute LED on the microphone lights, as with its own mute button -->
    <path d="M652 452h78" fill="none" stroke="#E5322D" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
    <path d="M730 452l-14-12M730 452l-14 12" fill="none" stroke="#E5322D" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="764" y="312" width="112" height="120" rx="52" fill="#2A2D33"/>
    <g clip-path="url(#head)" stroke="#3E434D" stroke-width="3">
      <path d="M760 336h120M760 352h120M760 368h120M760 384h120M760 400h120M760 416h120"/>
    </g>
    <rect x="764" y="312" width="112" height="120" rx="52" fill="none" stroke="#4A4F5A" stroke-width="2"/>
    <rect x="758" y="430" width="124" height="16" rx="6" fill="#3A3F48"/>
    <rect x="776" y="446" width="88" height="86" rx="16" fill="#23262C" stroke="#3A3F4B" stroke-width="2"/>
    <circle cx="820" cy="480" r="44" fill="url(#glow)"/>
    <circle cx="820" cy="480" r="9" fill="#FF453A"/>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#A7B0BE" text-anchor="middle">
      <text x="230" y="574">Live</text>
      <text x="540" y="574">Muted</text>
      <text x="820" y="574">Mute LED lights</text>
    </g>
  </g>

  <text x="549" y="652" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#7F8897" text-anchor="middle">macOS · With or without Maono Link · Several microphones · 8 languages</text>
</svg>
