name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # macOS only: the plugin and its CoreAudio helper (Swift) are macOS-only
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: com.ulanzi.maonomute.ulanziPlugin
          path: dist/com.ulanzi.maonomute.ulanziPlugin.zip
